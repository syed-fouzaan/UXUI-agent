services:
  - type: web
    name: azia-uxui-agent
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn azia.api_server:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: GROK_API_KEY
        sync: false
